# CI is the compiler for this project (see PROGRESS.md "How this project
# gets compiled"): no local environment currently both links executables
# and runs tests, so these jobs are the source of truth for "does it
# build / do the tests pass" on this remote. Mirrors
# .github/workflows/rust.yml step for step so GitHub and GitLab verify
# the same things; if one changes, change the other.

stages:
  - build
  - test

variables:
  CARGO_TERM_COLOR: always
  # Keep cargo's registry inside the project dir so it can be cached.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

.rust-base:
  image: rust:latest
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - target
  before_script:
    - rustc --version && cargo --version

rust-build:
  extends: .rust-base
  stage: build
  script:
    # Workspace build. This always compiles adrian-kernel WITH `std`,
    # because rian/boot-image depends on it as features = ["std"] and
    # resolver 2 unifies features across the invocation.
    - cargo build --verbose
    # The kernel's default no_std configuration -- the actual bare-metal
    # config, including the `#[cfg(not(feature = "std"))]` panic handler
    # -- would otherwise never be compiled at all, and bare-metal
    # breakage could land while CI stayed green. `-p adrian-kernel`
    # narrows the graph so boot-image drops out and `std` goes with it.
    - cargo build -p adrian-kernel --verbose

rust-test:
  extends: .rust-base
  stage: test
  script:
    # Runs every workspace test, including adrian-kernel's: boot-image's
    # `features = ["std"]` dependency means the kernel's test harness
    # gets std here without needing an explicit flag.
    - cargo test --verbose

# The first end-to-end check that boot actually runs, as opposed to
# merely compiling. `adrian-boot-image` builds a real BootContext, calls
# the real `entry::kernel_entry`, and exits non-zero unless init reported
# Ready *and* left a complete, in-order boot trace behind. Only a
# runnable step because init no longer ends in `halt_forever()` -- the
# wrapper used to have to be Ctrl+C'd.
# Not a bare-metal boot test: hosted port I/O is stubbed, so this
# verifies the init *sequence*, not the hardware bring-up.
boot-test:
  extends: .rust-base
  stage: test
  script:
    - cargo run -p adrian-boot-image

# `dart analyze` is the cheapest thing that catches a total compile
# break in the Dart packages: it type-checks without needing tests to
# exist. Deliberately NOT running `dart test` yet -- canvas declares a
# `test` dev-dependency but ships no test/ directory, so that step
# would fail for a reason unrelated to code health. `--fatal-infos`
# is intentional: these packages are small and new enough that keeping
# them lint-clean from the start is cheap.
dart-analyze:
  stage: test
  image: dart:stable
  parallel:
    matrix:
      - PACKAGE: ["sdk/dart", "canvas"]
  script:
    - cd "$PACKAGE"
    - dart pub get
    - dart analyze --fatal-infos

# The stdlib-only connection analyser's ground-truth checks (13 facts
# established by hand in PROGRESS.md before the analyser existed,
# including the regression guard for the isolated-node false positive).
# Not in the GitHub workflow; cheap enough to run everywhere.
graph-validate:
  stage: test
  image: python:3-slim
  script:
    - python3 tools/graph/validate.py

# ---------------------------------------------------------------------
# The bare-metal image
# ---------------------------------------------------------------------
#
# Two jobs rather than one, deliberately. They fail for entirely different
# reasons -- one means the freestanding target does not build, the other
# means the machine does not come up -- and a single job would report both
# as "image broken" and leave the bisect to a human. Splitting them also
# means the boot test cannot mask a build regression by never running.
#
# Neither job extends `.rust-base`: its cache points at the root `target/`,
# which this crate does not use (it is outside the workspace and builds
# into `rian/bare-metal/target/`).

image-build:
  stage: build
  image: rust:latest
  cache:
    key: image-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - rian/bare-metal/target
  script:
    # readelf and od are what verify_shape.sh is written against, in
    # preference to llvm-tools, precisely because the Rust image already
    # has them. Asserted rather than assumed: if that ever stops being
    # true the failure should name the missing tool, not produce sixteen
    # confusing check failures.
    - readelf --version | head -1
    - od --version | head -1
    - rustc --version && cargo --version
    # Prebuilt core and compiler_builtins for the target, so no -Z
    # build-std and no nightly. This is the whole reason the target is
    # x86_64-unknown-none rather than a custom JSON spec.
    - rustup target add x86_64-unknown-none
    # boot.s reaches the assembler through global_asm!(include_str!(...)),
    # which parses curly braces as format arguments -- so a brace anywhere
    # in that file, comments included, is a compile error. rustc reports it
    # against the include_str! call site in main.rs and never names the
    # offending line, which cost one CI round trip to find the first time
    # (the violating brace was inside the comment documenting the rule).
    # This grep costs nothing and names the file and line directly.
    - |
      if grep -n '[{}]' rian/bare-metal/src/boot.s; then
        echo "boot.s contains a curly brace at the line(s) above."
        echo "global_asm! parses braces as format arguments; remove them or"
        echo "switch the call site in main.rs to options(raw)."
        exit 1
      fi
    # cd first: the crate's .cargo/config.toml carries the target, the
    # linker script and the code/relocation model, and cargo finds it by
    # walking up from the working directory. Building from the repo root
    # would silently drop all four settings.
    - cd rian/bare-metal
    - cargo build --release --verbose
    - cd "$CI_PROJECT_DIR"
    - sh tools/image/verify_shape.sh rian/bare-metal/target/x86_64-unknown-none/release/rian
  artifacts:
    name: rian-image-$CI_COMMIT_SHORT_SHA
    paths:
      - rian/bare-metal/target/x86_64-unknown-none/release/rian
    expire_in: 1 week

# The first test in this project that runs kernel code on a CPU in ring 0
# rather than in a hosted process. `boot-test` above verifies the init
# *sequence*; this verifies the bring-up underneath it -- bss cleared,
# stack established, long mode entered, UART programmed from scratch --
# none of which the hosted path exercises even in principle.
image-boot:
  stage: test
  image: rust:latest
  needs: ["image-build"]
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends qemu-system-x86
    # -kernel takes the multiboot1 image directly, which is why the header
    # is multiboot1: multiboot2 would need GRUB and an ISO built with
    # xorriso, i.e. two more tools between a commit and a boot test.
    #
    # `timeout` because the image ends in `halt_forever()` and is supposed
    # to: a kernel that exits on its own is a kernel with test-only code in
    # it. `|| true` because timeout's 124 is the expected outcome, so the
    # verdict has to come from the log, not the exit status.
    # -display none and -no-reboot so a triple fault stays dead and visible
    # instead of resetting into a boot loop that eventually times out
    # looking exactly like a hang.
    - >
      timeout --foreground 30 qemu-system-x86_64
      -kernel rian/bare-metal/target/x86_64-unknown-none/release/rian
      -m 128M -display none -no-reboot -serial file:serial.log || true
    # Print it before asserting on it. When this job fails the log is the
    # entire diagnosis, and a failed assertion that swallowed its input
    # would send the next person back to CI for a second run.
    - echo "----- COM1 -----"
    - cat serial.log || echo "(no serial output at all)"
    - echo "----------------"
    - sh tools/image/verify_boot.sh serial.log
  artifacts:
    when: always
    paths:
      - serial.log
    expire_in: 1 week

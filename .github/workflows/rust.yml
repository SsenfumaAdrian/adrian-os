name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    # The workspace build above always compiles adrian-kernel WITH `std`,
    # because rian/boot-image depends on it as
    # `features = ["std"]` and resolver 2 unifies features across the
    # invocation. That means the kernel's default no_std configuration --
    # the actual bare-metal target, including the
    # `#[cfg(not(feature = "std"))]` panic handler -- would otherwise never
    # be compiled here at all, and bare-metal breakage could land while CI
    # stayed green. `-p adrian-kernel` narrows the graph so boot-image
    # drops out and `std` goes with it.
    - name: Build kernel in no_std mode
      run: cargo build -p adrian-kernel --verbose
    - name: Run tests
      run: cargo test --verbose

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    # The workspace build above always compiles adrian-kernel WITH `std`,
    # because rian/boot-image depends on it as
    # `features = ["std"]` and resolver 2 unifies features across the
    # invocation. That means the kernel's default no_std configuration --
    # the actual bare-metal target, including the
    # `#[cfg(not(feature = "std"))]` panic handler -- would otherwise never
    # be compiled here at all, and bare-metal breakage could land while CI
    # stayed green. `-p adrian-kernel` narrows the graph so boot-image
    # drops out and `std` goes with it.
    - name: Build kernel in no_std mode
      run: cargo build -p adrian-kernel --verbose
    - name: Run tests
      run: cargo test --verbose

  # Nothing checked the Dart side until now, so a total compile break in
  # sdk/dart or canvas could land on main with CI green. `dart analyze`
  # is the cheapest thing that would catch that: it type-checks without
  # needing tests to exist. Deliberately NOT running `dart test` yet --
  # canvas declares a `test` dev-dependency but ships no test/ directory,
  # so that step would fail for a reason unrelated to code health.
  # `--fatal-infos` is intentional: these packages are small and new
  # enough that keeping them lint-clean from the start is cheap.
  dart:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [sdk/dart, canvas]

    steps:
    - uses: actions/checkout@v4
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
    - name: Resolve dependencies
      working-directory: ${{ matrix.package }}
      run: dart pub get
    - name: Analyze
      working-directory: ${{ matrix.package }}
      run: dart analyze --fatal-infos
